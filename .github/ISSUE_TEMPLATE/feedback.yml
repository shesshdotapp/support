name: Share feedback
description: Share your experience or a topic that does not fit the other forms.
title: "[Feedback]: "
body:
  - type: markdown
    attributes:
      value: |
        Tell us about your experience with shessh. English and Bahasa Indonesia are welcome.
        Remove passwords, keys, tokens, and private server details before posting.
  - type: textarea
    id: feedback
    attributes:
      label: What would you like to share?
      placeholder: Tell us what worked well, felt confusing, or could be clearer.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context or examples (optional)
      placeholder: What were you trying to do? Screenshots are welcome.
  - type: textarea
    id: improvement
    attributes:
      label: What would improve your experience? (optional)
      placeholder: Describe what you would find more helpful.
