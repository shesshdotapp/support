name: Feature request
description: Suggest an improvement or new shessh workflow.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        This repository is the central public support desk for shessh.

        Use this form for feature ideas and workflow improvements. English and Bahasa Indonesia are welcome.
        For setup help, use Ask for help:
        https://github.com/shesshdotapp/support/issues/new?template=help_question.yml
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      placeholder: I switch between a terminal and a separate app to upload files to my VPS.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested solution
      placeholder: Add an SFTP file browser beside the terminal so I can upload and download files.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - SFTP
        - Terminal
        - SSH config
        - Keychain
        - Tabs
        - Split panes
        - Port forwarding
        - Installer or update
        - Website or download
        - Support workflow
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: Any workaround or similar app behavior you like?
    validations:
      required: false
  - type: textarea
    id: priority
    attributes:
      label: Why does this matter?
      placeholder: How often would you use it, and what does it unblock?
    validations:
      required: false
