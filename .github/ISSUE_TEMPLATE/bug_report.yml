name: Bug report
description: Report something broken in the app, installer, or website.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Describe what went wrong; you do not need to know its cause.
        English and Bahasa Indonesia are welcome. Write "Not sure" for details you do not know.
        Remove passwords, keys, tokens, and private server details from screenshots and logs.
  - type: dropdown
    id: area
    attributes:
      label: Where does the problem happen?
      options:
        - Tabs or split panes
        - Terminal display or keyboard shortcuts
        - Connection or authentication
        - Saved passwords or Keychain
        - SSH config import
        - Installer or update
        - Website or download
        - Crash, freeze, or performance
        - Other or not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Shessh version
      description: Use the version shown in About shessh. For a website-only issue, enter "Website".
      placeholder: 1.10.21 / Website / Not sure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and device
      description: Include your browser for website problems.
      placeholder: macOS 26, MacBook Pro M3 / Windows 11, Chrome / Not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: List the steps. If it happened only once, describe what you were doing at the time.
      placeholder: |
        1. Connect to the same VPS twice.
        2. Split the terminals side by side.
        3. Close one of the tabs.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      placeholder: The remaining terminal is blank, even though the connection is still open.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
      placeholder: The remaining terminal should stay visible and usable.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often does this happen? (optional)
      options:
        - Every time
        - Sometimes
        - Only once so far
        - Not sure
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots, logs, or extra context (optional)
      description: Include a workaround or the last working version if known. Remove private information.
